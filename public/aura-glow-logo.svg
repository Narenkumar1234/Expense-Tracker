<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Rainbow Gradient for Border -->
    <linearGradient id="rainbowBorder" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b30" />
      <stop offset="20%" stop-color="#ff9500" />
      <stop offset="40%" stop-color="#ffcc00" />
      <stop offset="60%" stop-color="#34c759" />
      <stop offset="80%" stop-color="#007aff" />
      <stop offset="100%" stop-color="#af52de" />
    </linearGradient>

    <!-- Icon Gradient -->
    <linearGradient id="chatGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b30" />
      <stop offset="50%" stop-color="#af52de" />
      <stop offset="100%" stop-color="#007aff" />
    </linearGradient>
  </defs>

  <!-- Rainbow Outer Border Frame -->
  <rect x="12" y="12" width="104" height="104" rx="28" fill="url(#rainbowBorder)" />

  <!-- Inner Dark Core Matching App Surface -->
  <rect x="20" y="20" width="88" height="88" rx="22" fill="#171b26" />

  <!-- Scaled Chat Glyph with 3 Lines Cutout -->
  <g transform="translate(40, 40) scale(2)">
    <path
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="M20 2H4C2.9 2 2 2.9 2 4V22L6 18H20C21.1 18 22 17.1 22 16V4C22 2.9 21.1 2 20 2ZM6 6H18V8H6V6ZM6 9.5H18V11.5H6V9.5ZM6 13H14V15H6V13Z"
      fill="url(#chatGrad)"
    />
  </g>
</svg>
