<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#142621" />
      <stop offset="60%" stop-color="#0a1215" />
      <stop offset="100%" stop-color="#05080c" />
    </radialGradient>

    <!-- Emerald Aura Gradient -->
    <linearGradient id="auraGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4edea3" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Holographic Cyan/Emerald -->
    <linearGradient id="haloGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="128" cy="128" r="128" fill="url(#bgGrad)" />

  <!-- Outer Ambient Ring -->
  <circle cx="128" cy="128" r="112" fill="none" stroke="url(#auraGlow)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4" />
  <circle cx="128" cy="128" r="120" fill="none" stroke="#10b981" stroke-width="1" opacity="0.2" />

  <!-- Aura Ambient Glow -->
  <circle cx="128" cy="120" r="54" fill="url(#auraGlow)" opacity="0.22" filter="url(#coreGlow)" />

  <!-- Stylized Geometric AI Orb / Persona Silhouette -->
  <!-- Outer Facets -->
  <polygon points="128,48 184,80 184,144 128,176 72,144 72,80" fill="#0d1f1a" stroke="url(#auraGlow)" stroke-width="3" stroke-linejoin="round" />

  <!-- Inner Shards -->
  <polygon points="128,64 168,88 168,136 128,160 88,136 88,88" fill="none" stroke="url(#haloGrad)" stroke-width="2" stroke-linejoin="round" opacity="0.8" />

  <!-- Core Facet Lines -->
  <line x1="128" y1="48" x2="128" y2="176" stroke="url(#auraGlow)" stroke-width="2" opacity="0.85" />
  <line x1="72" y1="80" x2="184" y2="144" stroke="url(#auraGlow)" stroke-width="1.5" opacity="0.6" />
  <line x1="72" y1="144" x2="184" y2="80" stroke="url(#auraGlow)" stroke-width="1.5" opacity="0.6" />

  <!-- Center Luminous Spark / Eye -->
  <circle cx="128" cy="112" r="14" fill="#ffffff" filter="url(#softGlow)" />
  <circle cx="128" cy="112" r="7" fill="#4edea3" />

  <!-- Lower Persona Shoulder / Wings Wave -->
  <path d="M 64,204 C 84,182 104,174 128,174 C 152,174 172,182 192,204 C 172,216 150,222 128,222 C 106,222 84,216 64,204 Z" fill="url(#auraGlow)" opacity="0.35" />
  <path d="M 76,208 C 92,192 110,186 128,186 C 146,186 164,192 180,208" fill="none" stroke="#4edea3" stroke-width="2" stroke-linecap="round" opacity="0.75" />

  <!-- Floating Sparkles -->
  <circle cx="68" cy="100" r="2.5" fill="#4edea3" opacity="0.7" />
  <circle cx="192" cy="94" r="3" fill="#6ee7b7" opacity="0.8" />
  <circle cx="178" cy="160" r="2" fill="#4edea3" opacity="0.6" />
  <circle cx="78" cy="164" r="2" fill="#6ee7b7" opacity="0.6" />
</svg>
