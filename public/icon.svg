<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="128" fill="#0f131d" />
  <defs>
    <linearGradient id="auraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4edea3" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer glowing emerald aura diamond -->
  <polygon points="256,64 432,256 256,448 80,256" fill="url(#auraGrad)" opacity="0.15" filter="url(#glow)" />
  <!-- Main faceted gemstone -->
  <polygon points="256,80 416,256 256,432 96,256" fill="none" stroke="url(#auraGrad)" stroke-width="24" stroke-linejoin="round" />
  <!-- Inner gemstone facet lines -->
  <polygon points="256,160 352,256 256,352 160,256" fill="url(#auraGrad)" opacity="0.3" stroke="url(#auraGrad)" stroke-width="12" stroke-linejoin="round" />
  <line x1="256" y1="80" x2="256" y2="432" stroke="url(#auraGrad)" stroke-width="12" stroke-linecap="round" />
  <line x1="96" y1="256" x2="416" y2="256" stroke="url(#auraGrad)" stroke-width="12" stroke-linecap="round" />
  <circle cx="256" cy="256" r="32" fill="#4edea3" filter="url(#glow)" />
</svg>
