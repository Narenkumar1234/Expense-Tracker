<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aura" />
    <meta name="theme-color" content="#0f131d" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Aura Personal Finance & Vault</title>
    <meta name="description" content="Obsidian Emerald personal wealth management, smart budgeting, card cycle intelligence, and telemetry ledger." />
    <meta property="og:title" content="Aura Personal Finance & Vault" />
    <meta property="og:description" content="Obsidian Emerald personal wealth management, smart budgeting, card cycle intelligence, and telemetry ledger." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  </head>
  <body class="bg-[#0f131d] text-[#dfe2f1] antialiased selection:bg-[#10b981]/30 selection:text-[#4edea3]">
    <div id="root">
      <div id="pwa-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background-color:#0f131d;color:#dfe2f1;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;z-index:9999;user-select:none;">
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;animation:pwaPulse 1.8s ease-in-out infinite;">
          <div style="width:56px;height:56px;padding:2px;border-radius:16px;background:linear-gradient(to top right, #ff3b30, #ff9500, #ffcc00, #34c759, #007aff, #af52de);flex-shrink:0;">
            <div style="width:100%;height:100%;border-radius:14px;background-color:#171b26;display:flex;align-items:center;justify-content:center;">
              <svg viewBox="0 0 24 24" style="width:26px;height:26px;display:block;" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="pwaSplashChatGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#ff3b30" />
                    <stop offset="50%" stop-color="#af52de" />
                    <stop offset="100%" stop-color="#007aff" />
                  </linearGradient>
                </defs>
                <path
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M20 2H4C2.9 2 2 2.9 2 4V22L6 18H20C21.1 18 22 17.1 22 16V4C22 2.9 21.1 2 20 2ZM6 6H18V8H6V6ZM6 9.5H18V11.5H6V9.5ZM6 13H14V15H6V13Z"
                  fill="url(#pwaSplashChatGrad)"
                />
              </svg>
            </div>
          </div>
          <span style="font-size:24px;font-weight:700;letter-spacing:-0.025em;color:#dfe2f1;">Aura</span>
        </div>
      </div>
      <style>
        @keyframes pwaPulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.55; transform: scale(0.98); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
